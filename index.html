      <div class="td-quickadd">
        <span class="td-quickadd-icon">✏️</span>
        <input type="text" class="inp td-quickadd-inp" placeholder="아이에게 할 일을 내주세요 (Enter로 추가)" maxlength="40" />
      </div>
    `;
  },

  _itemHtml(t){
    const locked = t.secret && !App.canSee(t);
    if(locked){
      return `
        <div class="td-item td-item--locked">
          <div class="td-check td-check--locked" aria-hidden="true">🔒</div>
          <div class="td-text"><span class="td-txt">비밀 할 일</span></div>
        </div>
      `;
    }
    const mine = !!t.secret && App.canSee(t);
    const parentLocked = !App.isMaster() && t.owner === 'm2';
    return `
      <div class="td-row" data-row="${t.id}" data-locked="${parentLocked ? '1' : '0'}">
        <div class="td-swipe-bg td-swipe-bg-right" aria-hidden="true">
          <svg class="td-swipe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 18 20 6"></polyline></svg>
        </div>
        <div class="td-swipe-bg td-swipe-bg-left" aria-hidden="true">
          <span class="td-swipe-icon td-swipe-icon--trash">🗑</span>
        </div>
        <div class="td-item ${t.done ? 'done' : ''} ${mine ? 'td-item--secret' : ''}" data-id="${t.id}" data-dragged="0">
          <button type="button" class="td-check ${t.done ? 'on' : ''}" data-check="${t.id}" aria-label="${t.done ? '완료 취소하기' : '완료로 표시하기'}">
            <span class="td-check-box">
              <svg class="td-check-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 18 20 6"></polyline></svg>
            </span>
          </button>
          <div class="td-text" data-edit="${t.id}">
            ${mine ? '<span class="td-secret-tag">🤫</span>' : ''}
            <span class="td-txt">${this._esc(t.text)}</span>
            ${mine ? '<span class="td-mine-badge">나만 보임</span>' : ''}
          </div>
          ${t.coin > 0 ? `<span class="td-coin">🪙 ${t.coin}</span>` : ''}
        </div>
      </div>
    `;
  },

  _bind(root){
    root.querySelectorAll('[data-day]').forEach(chip => {
      chip.addEventListener('click', () => {
        App.day = Number(chip.dataset.day);
        App.render();
      });
    });

    root.querySelectorAll('[data-check]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const item = btn.closest('.td-item');
        if(item && item.dataset.dragged === '1') return;
        this._toggle(btn.dataset.check);
      });
    });

    root.querySelectorAll('[data-edit]').forEach(el => {
      el.addEventListener('click', () => {
        const item = el.closest('.td-item');
        if(item && item.dataset.dragged === '1') return;
        this.openEditor(el.dataset.edit);
      });
    });

    root.querySelectorAll('.td-row[data-row]').forEach(rowEl => {
      this._bindSwipeRow(rowEl);
    });

    const addBtn = root.querySelector('.td-add-btn');
    if(addBtn){
      addBtn.addEventListener('click', () => this.openEditor(null));
    }

    const rewardBtn = root.querySelector('.td-goto-reward');
    if(rewardBtn){
      rewardBtn.addEventListener('click', () => App.go('reward'));
    }

    const quickInp = root.querySelector('.td-quickadd-inp');
    if(quickInp){
      quickInp.addEventListener('keydown', (e) => {
        if(e.key === 'Enter'){
          const val = quickInp.value.trim();
          if(!val) return;
          App.state.todos.push({
            id: uid(),
            day: App.day,
            for: App.vm(),
            text: val,
            coin: App.canSetCoin() ? 10 : 0,
            done: false,
            secret: false,
            owner: App.meId()
          });
          App.save();
          App.toast('할 일을 냈어요!');
          App.render();
        }
      });
    }
  },

  _toggle(id){
    const t = App.state.todos.find(x => x.id === id);
    if(!t || !App.canSee(t)) return;
    const willBeDone = !t.done;
    t.done = willBeDone;
    if(willBeDone){
      App.state.coins = (App.state.coins || 0) + (t.coin || 0);
    } else {
      App.state.coins = Math.max(0, (App.state.coins || 0) - (t.coin || 0));
    }
    App.save();
    if(App.haptic) App.haptic();
    if(willBeDone) window.ModSound && ModSound.play('check');
    if(willBeDone && t.coin > 0) window.ModSound && ModSound.play('coin');

    const dayTodos = App.todosOf(t.day).filter(x => App.canSee(x));
    const remaining = dayTodos.filter(x => !x.done).length;
    const key = `${App.vm()}_${t.day}`;
    this._celebrated = this._celebrated || {};

    if(willBeDone){
      if(t.coin > 0){
        App.toast(`🪙 ${t.coin}코인 획득!`);
      } else {
        App.toast('완료했어요!');
      }
      if(dayTodos.length > 0 && remaining === 0 && !this._celebrated[key]){
        this._celebrated[key] = true;
        const coinTotal = dayTodos.reduce((s, x) => s + (x.coin || 0), 0);
        this._celebrate(coinTotal);
      }
    } else {
      this._celebrated[key] = false;
    }

    if(willBeDone && window.ModBadge && typeof ModBadge.check === 'function'){ ModBadge.check('todo'); }

    App.render();
  },

  _celebrate(coinTotal){
    window.ModSound && ModSound.play('complete');
    const phone = document.getElementById('phone');
    if(!phone) return;

    clearTimeout(this._celeTimer);
    const prevOverlay = phone.querySelector('.td-cele');
    if(prevOverlay) prevOverlay.remove();

    const overlay = document.createElement('div');
    overlay.className = 'td-cele';

    const pieceCount = 40 + Math.floor(Math.random() * 21); // 40~60
    let confettiHtml = '';
    for(let i = 0; i < pieceCount; i++){
      const left = (Math.random() * 100).toFixed(1);
      const color = PALETTE[Math.floor(Math.random() * PALETTE.length)].fill;
      const rot = Math.floor(Math.random() * 360);
      const delay = (Math.random() * 0.5).toFixed(2);
      const dur = (1.8 + Math.random() * 1.2).toFixed(2);
      confettiHtml += `<i class="td-confetti" style="left:${left}%; background:${color}; transform:rotate(${rot}deg); animation-delay:${delay}s; animation-duration:${dur}s;"></i>`;
    }

    overlay.innerHTML = `
      ${confettiHtml}
      <div class="td-cele-card">
        <div class="td-cele-emoji">🎉</div>
        <div class="td-cele-title">오늘 할 일 완료!</div>
        ${coinTotal > 0 ? `<div class="td-cele-coin">🪙 ${coinTotal}코인 모았어요</div>` : ''}
        <button type="button" class="btn full td-cele-go">보상 받으러 가기 →</button>
      </div>
    `;

    overlay.addEventListener('click', () => this._closeCelebrate());
    overlay.querySelector('.td-cele-go').addEventListener('click', (e) => {
      e.stopPropagation();
      this._closeCelebrate();
      App.go('reward');
    });

    phone.appendChild(overlay);

    this._celeTimer = setTimeout(() => this._closeCelebrate(), 3200);
  },

  _closeCelebrate(){
    clearTimeout(this._celeTimer);
    const phone = document.getElementById('phone');
    const overlay = phone && phone.querySelector('.td-cele');
    if(overlay) overlay.remove();
  },

  /* ================= 스와이프 제스처 ================= */

  _bindSwipeRow(rowEl){
    const id = rowEl.dataset.row;
    const itemEl = rowEl.querySelector('.td-item');
    if(!itemEl) return;
    const t = App.state.todos.find(x => x.id === id);
    if(!t) return;
    const parentLocked = rowEl.dataset.locked === '1';
    const bgRight = rowEl.querySelector('.td-swipe-bg-right');
    const bgLeft = rowEl.querySelector('.td-swipe-bg-left');
    const THRESH_RATIO = 0.32;

    let dragging = false, axis = null, startX = 0, startY = 0, curX = 0, rowW = 0;
    let captured = false, pointerId = null, blockedAttempt = false;

    const resetBg = () => {
      if(bgRight){ bgRight.style.opacity = '0'; bgRight.classList.remove('td-swipe-bg--armed'); }
      if(bgLeft){ bgLeft.style.opacity = '0'; bgLeft.classList.remove('td-swipe-bg--armed'); }
    };

    const onDown = e => {
      if(e.button != null && e.button !== 0) return;
      dragging = true; axis = null; curX = 0; blockedAttempt = false; captured = false;
      startX = e.clientX; startY = e.clientY;
      rowW = rowEl.offsetWidth || 300;
      pointerId = e.pointerId;
      itemEl.dataset.dragged = '0';
    };

    const onMove = e => {
      if(!dragging) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if(axis === null){
        if(Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        axis = Math.abs(dx) > Math.abs(dy) * 1.15 ? 'x' : 'y';
        if(axis === 'y'){ dragging = false; return; }
        // 가로 스와이프 확정 — 이제부터 포인터를 이 요소에 붙잡아 둠
        itemEl.dataset.dragged = '1';
        itemEl.style.transition = 'none';
        if(itemEl.setPointerCapture && pointerId != null){
          try{ itemEl.setPointerCapture(pointerId); captured = true; }catch(err){}
        }
      }
      if(axis !== 'x') return;
      if(e.cancelable) e.preventDefault();

      let x = dx;
      if(x < 0 && parentLocked){
        x = Math.max(x * 0.45, -rowW * 0.24);
        if(x < -30) blockedAttempt = true;
      } else {
        const cap = rowW * 0.92;
        if(x > cap) x = cap + (x - cap) * 0.18;
        if(x < -cap) x = -cap + (x + cap) * 0.18;
      }
      curX = x;
      itemEl.style.transform = `translateX(${x}px)`;

      const thresh = rowW * THRESH_RATIO;
      if(x > 0){
        if(bgRight){
          bgRight.style.opacity = String(Math.min(1, x / 28));
          bgRight.classList.toggle('td-swipe-bg--armed', x > thresh);
        }
        if(bgLeft){ bgLeft.style.opacity = '0'; bgLeft.classList.remove('td-swipe-bg--armed'); }
      } else if(x < 0){
        if(bgLeft){
          bgLeft.style.opacity = String(Math.min(1, Math.abs(x) / 28));
          bgLeft.classList.toggle('td-swipe-bg--armed', Math.abs(x) > thresh);
        }
        if(bgRight){ bgRight.style.opacity = '0'; bgRight.classList.remove('td-swipe-bg--armed'); }
      } else {
        resetBg();
      }
    };

    const onUp = () => {
      if(!dragging){ axis = null; return; }
      dragging = false;
      if(captured && itemEl.releasePointerCapture && pointerId != null){
        try{ itemEl.releasePointerCapture(pointerId); }catch(err){}
      }
      if(axis !== 'x'){ axis = null; return; }
      const thresh = rowW * THRESH_RATIO;
      if(curX > thresh){
        this._completeSwipe(rowEl, itemEl, id);
      } else if(curX < -thresh && !parentLocked){
        this._deleteSwipe(rowEl, itemEl, id);
      } else {
        this._snapBack(rowEl, itemEl);
        if(parentLocked && blockedAttempt){
          App.toast('부모님이 낸 할 일은 지울 수 없어요');
        }
      }
      axis = null;
    };

    itemEl.addEventListener('pointerdown', onDown);
    itemEl.addEventListener('pointermove', onMove);
    itemEl.addEventListener('pointerup', onUp);
    itemEl.addEventListener('pointercancel', onUp);
  },

  _snapBack(rowEl, itemEl){
    itemEl.style.transition = 'transform .42s cubic-bezier(.22,1,.36,1)';
    itemEl.style.transform = 'translateX(0)';
    const bgRight = rowEl.querySelector('.td-swipe-bg-right');
    const bgLeft = rowEl.querySelector('.td-swipe-bg-left');
    [bgRight, bgLeft].forEach(bg => {
      if(!bg) return;
      bg.style.transition = 'opacity .3s';
      bg.style.opacity = '0';
      bg.classList.remove('td-swipe-bg--armed');
    });
  },

  _completeSwipe(rowEl, itemEl, id){
    const width = rowEl.offsetWidth || 300;
    itemEl.style.transition = 'transform .26s cubic-bezier(.22,1,.36,1), opacity .22s';
    itemEl.style.transform = `translateX(${width}px)`;
    itemEl.style.opacity = '0.35';
    clearTimeout(this._swipeActTimer);
    this._swipeActTimer = setTimeout(() => { this._toggle(id); }, 230);
  },

  _deleteSwipe(rowEl, itemEl, id){
    const t = App.state.todos.find(x => x.id === id);
    if(!t) return;
    const originalIndex = App.state.todos.indexOf(t);
    const width = rowEl.offsetWidth || 300;

    itemEl.style.transition = 'transform .22s cubic-bezier(.4,0,1,1), opacity .22s';
    itemEl.style.transform = `translateX(-${width}px)`;
    itemEl.style.opacity = '0';

    clearTimeout(this._swipeActTimer);
    this._swipeActTimer = setTimeout(() => {
      const h = rowEl.offsetHeight;
      rowEl.style.maxHeight = h + 'px';
      // 강제 리플로우 후 0으로 접기
      void rowEl.offsetHeight;
      rowEl.style.maxHeight = '0px';
      rowEl.style.opacity = '0';
      rowEl.style.marginBottom = '0px';

      clearTimeout(this._swipeCollapseTimer);
      this._swipeCollapseTimer = setTimeout(() => {
        const idx = App.state.todos.indexOf(t);
        if(idx > -1) App.state.todos.splice(idx, 1);
        App.save();
        this._showUndo(t, originalIndex);
        App.render();
      }, 300);
    }, 200);
  },

  _showUndo(item, originalIndex){
    clearTimeout(this._undoTimer);
    const phone = document.getElementById('phone');
    if(!phone) return;
    const prev = phone.querySelector('.td-undo');
    if(prev) prev.remove();

    const bar = document.createElement('div');
    bar.className = 'td-undo';
    bar.innerHTML = `
      <span class="td-undo-msg">"${this._esc(item.text)}" 삭제됨</span>
      <button type="button" class="td-undo-btn">실행 취소</button>
    `;
    phone.appendChild(bar);
    requestAnimationFrame(() => requestAnimationFrame(() => bar.classList.add('show')));

    bar.querySelector('.td-undo-btn').addEventListener('click', () => {
      clearTimeout(this._undoTimer);
      const idx = Math.min(originalIndex, App.state.todos.length);
      App.state.todos.splice(idx, 0, item);
      App.save();
      this._hideUndo();
      App.render();
      App.toast('되돌렸어요');
    });

    this._undoTimer = setTimeout(() => this._hideUndo(), 5000);
  },

  _hideUndo(){
    clearTimeout(this._undoTimer);
    const phone = document.getElementById('phone');
    const bar = phone && phone.querySelector('.td-undo');
    if(!bar) return;
    bar.classList.remove('show');
    setTimeout(() => { if(bar.parentNode) bar.parentNode.removeChild(bar); }, 260);
  },

  _esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
};

  render(root) {
    // 진행 중이던 애니메이션/타이머 정리 (멱등성 보장)
    if (ModReward._raf) { cancelAnimationFrame(ModReward._raf); ModReward._raf = null; }
    if (ModReward._celTimer) { clearTimeout(ModReward._celTimer); ModReward._celTimer = null; }
    if (ModReward._timers) { ModReward._timers.forEach(dispose => { try { dispose(); } catch (e) {} }); }
    ModReward._timers = [];
    if (!ModReward._dismissed) ModReward._dismissed = {};

    function addTimeout(fn, ms) {
      const id = setTimeout(fn, ms);
      ModReward._timers.push(() => clearTimeout(id));
      return id;
    }
    function addRaf(fn) {
      const id = requestAnimationFrame(fn);
      ModReward._timers.push(() => cancelAnimationFrame(id));
      return id;
    }

    // ---- 헬퍼 ----
    function escHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function fmtDate() {
      const d = new Date();
      return (d.getMonth() + 1) + '.' + d.getDate();
    }

    function ensureDefaults() {
      const r = App.state.reward;
      let changed = false;
      if (!r.tiers) {
        r.tiers = {
          gold: r.realBenefit || '',
          silver: (r.realBenefit || '') + ' (조금 작게)',
          bronze: '아쉽지만 작은 응원 선물이에요 🍭'
        };
        changed = true;
      }
      if (!r.history) { r.history = []; changed = true; }
      // 실물 보상 수령 확인 필드 마이그레이션 (기존 기록은 claimed:false 로 채움)
      r.history.forEach(h => {
        if (!h.id) { h.id = uid(); changed = true; }
        if (typeof h.claimed !== 'boolean') { h.claimed = false; changed = true; }
        if (h.claimedAt === undefined) { h.claimedAt = null; changed = true; }
        if (typeof h.requested !== 'boolean') { h.requested = false; changed = true; }
      });
      if (changed) App.save();
    }

    const GAMES = {
      stop: { emoji: '🎯', label: '럭키 스톱' },
      gacha: { emoji: '🥚', label: '랜덤 뽑기' },
      ladder: { emoji: '🪜', label: '사다리타기' },
      roulette: { emoji: '🎡', label: '룰렛' }
    };
    const TIER_META = {
      gold: { medal: '🥇', label: '🥇 골드!' },
      silver: { medal: '🥈', label: '🥈 실버' },
      bronze: { medal: '🥉', label: '🥉 브론즈' }
    };
    const ROULETTE_LAYOUT = ['bronze', 'silver', 'bronze', 'gold', 'bronze', 'silver', 'bronze', 'bronze'];

    function ensureGameDefaults() {
      const r = App.state.reward;
      let changed = false;
      if (!r.game || !GAMES[r.game]) { r.game = 'stop'; changed = true; }
      if (typeof r.freePick !== 'boolean') { r.freePick = true; changed = true; }
      if (changed) App.save();
    }

    function weightedTier() {
      const roll = Math.random() * 100;
      if (roll < 10) return 'gold';
      if (roll < 40) return 'silver';
      return 'bronze';
    }

    function earnedStats() {
      const todos = App.state.todos || [];
      let today = 0, week = 0;
      todos.forEach(t => {
        if (t.done && App.canSee(t)) {
          week += (t.coin || 0);
          if (t.day === App.today) today += (t.coin || 0);
        }
      });
      return { today, week };
    }

    function animateCoinNum(el, from, to) {
      if (from === to) { el.textContent = to; return; }
      const dur = 600, start = performance.now();
      function step(now) {
        const p = Math.min(1, (now - start) / dur);
        const eased = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(from + (to - from) * eased);
        if (p < 1) { ModReward._coinRaf = requestAnimationFrame(step); }
        else { el.textContent = to; ModReward._coinRaf = null; }
      }
      if (ModReward._coinRaf) cancelAnimationFrame(ModReward._coinRaf);
      ModReward._coinRaf = requestAnimationFrame(step);
    }

    ensureDefaults();
    ensureGameDefaults();

    // ---- 게임별 상태(모듈 전역, render 재호출에도 유지) ----
    function freshGameState(kind) {
      return {
        kind: kind,
        phase: 'idle',   // idle | playing | result
        tier: null,
        celebrate: false,
        stop: { pos: 50, dir: 1, lastTs: 0, playing: false },
        gacha: { capsules: [], pickedIdx: null, sub: 'choose' },
        ladder: { lanes: 0, rows: 7, rungs: [], tiers: [], startIdx: null, path: null, endCol: null, sub: 'pick' },
        roulette: { rotation: 0, targetTier: null }
      };
    }

    if (!ModReward._game || ModReward._game.kind !== App.state.reward.game) {
      ModReward._game = freshGameState(App.state.reward.game);
    }
    const g = ModReward._game;

    // ---- 럭키 스톱 루프 ----
    function loop(ts) {
      const s = g.stop;
      if (!s.playing) return;
      if (!s.lastTs) s.lastTs = ts;
      const dt = ts - s.lastTs;
      s.lastTs = ts;
      const speed = 0.078; // %/ms
      s.pos += s.dir * speed * dt;
      if (s.pos >= 100) { s.pos = 100; s.dir = -1; }
      else if (s.pos <= 0) { s.pos = 0; s.dir = 1; }
      const markerEl = root.querySelector('.rw-marker');
      if (markerEl) markerEl.style.left = s.pos + '%';
      ModReward._raf = requestAnimationFrame(loop);
    }
    function tierForPos(pos) {
      const d = Math.abs(pos - 50);
      if (d <= 4) return 'gold';
      if (d <= 19) return 'silver';
      return 'bronze';
    }

    // ---- 공통 액션 ----
    function chargeCoin() {
      const r = App.state.reward;
      if (App.state.coins < r.cost) return false;
      App.state.coins -= r.cost;
      App.save();
      App.haptic();
      return true;
    }

    function finalizeResult(tier) {
      g.tier = tier;
      g.phase = 'result';
      window.ModSound && ModSound.play(tier === 'gold' ? 'win' : 'lose');
      const r = App.state.reward;
      const benefitText = (r.tiers && r.tiers[tier]) || r.realBenefit;
      r.history = r.history || [];
      r.history.unshift({ id: uid(), date: fmtDate(), tier, benefit: benefitText, cost: r.cost, claimed: false, claimedAt: null, requested: false });
      App.save();
      App.haptic();
      paint();
    }

    function resultBlockHTML(tier) {
      const r = App.state.reward;
      const benefit = (r.tiers && r.tiers[tier]) || r.realBenefit;
      const meta = TIER_META[tier];
      const confettiCount = tier === 'gold' ? 18 : tier === 'silver' ? 8 : 0;
      const emos = ['🎉', '✨', '🎊', '⭐'];
      let confetti = '';
      for (let i = 0; i < confettiCount; i++) {
        const left = Math.round(Math.random() * 90) + 5;
        const delay = (Math.random() * 0.4).toFixed(2);
        confetti += `<span style="left:${left}%;animation-delay:${delay}s">${emos[i % emos.length]}</span>`;
      }
      return `
      <div class="rw-result ${tier}">
        <div class="rw-confetti">${confetti}</div>
        <div class="rw-result-medal">${meta.medal}</div>
        <div class="rw-result-tier">${meta.label}</div>
        <div class="rw-result-benefit">${escHtml(benefit)}</div>
      </div>`;
    }

    function retryButtonHTML() {
      const r = App.state.reward;
      const enough = App.state.coins >= r.cost;
      return `
      <button class="rw-retry-btn" id="rwRetryBtn" ${enough ? '' : 'disabled'}>${enough ? `다시 도전하기 (-${r.cost} 🪙)` : '코인이 부족해요'}</button>
      ${!enough ? `<div class="rw-play-hint">할 일을 더 완료해야 해요</div>` : ''}`;
    }

    // ---- 1) 럭키 스톱 ----
    function startStop() {
      if (!chargeCoin()) return;
      window.ModSound && ModSound.play('spin');
      const s = g.stop;
      s.pos = 50; s.dir = 1; s.lastTs = 0; s.playing = true;
      g.phase = 'playing'; g.tier = null;
      paint();
    }
    function stopStop() {
      const s = g.stop;
      if (!s.playing) return;
      if (ModReward._raf) { cancelAnimationFrame(ModReward._raf); ModReward._raf = null; }
      s.playing = false;
      finalizeResult(tierForPos(s.pos));
    }
    function trackHTML(pos) {
      return `<div class="rw-track"><div class="rw-marker" style="left:${pos}%"></div></div>
      <div class="rw-track-labels"><span>🥉</span><span>🥈</span><span>🥇</span><span>🥈</span><span>🥉</span></div>`;
    }
    function stopSectionHTML() {
      const r = App.state.reward;
      const enough = App.state.coins >= r.cost;
      if (g.phase === 'playing') {
        return `
        <div class="rw-game-title">럭키 스톱</div>
        <div class="rw-game-desc">마커가 골드 구역에 멈추면 최고의 보상을 받아요!</div>
        ${trackHTML(g.stop.pos)}
        <button class="rw-play-btn stop" id="rwStopBtn">STOP! ✋</button>`;
      }
      if (g.phase === 'result') {
        return `
        <div class="rw-game-title">럭키 스톱 결과</div>
        ${trackHTML(g.stop.pos)}
        ${resultBlockHTML(g.tier)}
        ${retryButtonHTML()}`;
      }
      return `
      <div class="rw-game-title">럭키 스톱</div>
      <div class="rw-game-desc">마커가 좌우로 움직여요. 딱 맞는 순간 STOP을 눌러보세요!</div>
      ${trackHTML(50)}
      <button class="rw-play-btn" id="rwPlayBtn" ${enough ? '' : 'disabled'}>${enough ? `플레이하기 (-${r.cost} 🪙)` : '코인이 부족해요'}</button>
      ${!enough ? `<div class="rw-play-hint">할 일을 더 완료해야 해요</div>` : ''}`;
    }

    // ---- 2) 랜덤 뽑기 (가챠 캡슐) ----
    function startGacha() {
      if (!chargeCoin()) return;
      window.ModSound && ModSound.play('spin');
      const ga = g.gacha;
      const count = 3 + Math.floor(Math.random() * 3); // 3~5
      ga.capsules = Array.from({ length: count }, (_, i) => ({ id: i, tier: weightedTier() }));
      ga.pickedIdx = null;
      ga.sub = 'choose';
      g.phase = 'playing'; g.tier = null;
      paint();
    }
    function pickCapsule(idx) {
      const ga = g.gacha;
      if (ga.sub !== 'choose') return;
      ga.pickedIdx = idx;
      ga.sub = 'opening';
      App.haptic();
      paint();
      addTimeout(() => { finalizeResult(ga.capsules[idx].tier); }, 1750);
    }
    function gachaSectionHTML() {
      const r = App.state.reward;
      const enough = App.state.coins >= r.cost;
      const ga = g.gacha;
      if (g.phase === 'playing' && ga.sub === 'choose') {
        const row = ga.capsules.map((c, i) => `<div class="rw-capsule" data-idx="${i}"></div>`).join('');
        return `
        <div class="rw-game-title">랜덤 뽑기</div>
        <div class="rw-game-desc">캡슐 하나를 골라 탭 해보세요!</div>
        <div class="rw-gacha-row">${row}</div>
        <div class="rw-gacha-hint">마음에 드는 캡슐을 골라주세요 👆</div>`;
      }
      if (g.phase === 'playing' && ga.sub === 'opening') {
        return `
        <div class="rw-game-title">랜덤 뽑기</div>
        <div class="rw-gacha-stage">
          <div class="rw-cap-big">
            <div class="rw-cap-top"></div>
            <div class="rw-cap-light"></div>
            <div class="rw-cap-bottom"></div>
          </div>
        </div>
        <div class="rw-gacha-hint">캡슐이 열리고 있어요...</div>`;
      }
      if (g.phase === 'result') {
        return `
        <div class="rw-game-title">랜덤 뽑기 결과</div>
        ${resultBlockHTML(g.tier)}
        ${retryButtonHTML()}`;
      }
      return `
      <div class="rw-game-title">랜덤 뽑기</div>
      <div class="rw-game-desc">캡슐 머신 속 캡슐 중 하나를 골라보세요!</div>
      <button class="rw-play-btn" id="rwPlayBtn" ${enough ? '' : 'disabled'}>${enough ? `플레이하기 (-${r.cost} 🪙)` : '코인이 부족해요'}</button>
      ${!enough ? `<div class="rw-play-hint">할 일을 더 완료해야 해요</div>` : ''}`;
    }

    // ---- 3) 사다리타기 ----
    function laneX(i, lanes) { return (i + 0.5) * (100 / lanes); }
    function generateRungs(lanes, rows) {
      const rungs = [];
      for (let r = 0; r < rows; r++) {
        const row = new Array(lanes - 1).fill(false);
        for (let i = 0; i < lanes - 1; i++) {
          if (row[i - 1]) continue;
          if (Math.random() < 0.45) row[i] = true;
        }
        rungs.push(row);
      }
      return rungs;
    }
    function computeLadderPath(rungs, lanes, rows, startCol, rowH) {
      let col = startCol;
      const pts = [{ x: laneX(col, lanes), y: 10 }];
      for (let r = 0; r < rows; r++) {
        const row = rungs[r];
        const yMid = 10 + (r + 0.5) * rowH;
        const yBot = 10 + (r + 1) * rowH;
        pts.push({ x: laneX(col, lanes), y: yMid });
        if (col > 0 && row[col - 1]) { col -= 1; pts.push({ x: laneX(col, lanes), y: yMid }); }
        else if (col < lanes - 1 && row[col]) { col += 1; pts.push({ x: laneX(col, lanes), y: yMid }); }
        pts.push({ x: laneX(col, lanes), y: yBot });
      }
      return { pts, endCol: col };
    }
    function pathLength(pts) {
      let len = 0;
      for (let i = 1; i < pts.length; i++) {
        len += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
      }
      return len;
    }
    function startLadder() {
      if (!chargeCoin()) return;
      window.ModSound && ModSound.play('spin');
      const la = g.ladder;
      la.lanes = 3 + Math.floor(Math.random() * 2); // 3~4
      la.rows = 7;
      la.rungs = generateRungs(la.lanes, la.rows);
      la.tiers = Array.from({ length: la.lanes }, () => weightedTier());
      la.startIdx = null;
      la.path = null;
      la.endCol = null;
      la.sub = 'pick';
      g.phase = 'playing'; g.tier = null;
      paint();
    }
    function pickLadderStart(idx) {
      const la = g.ladder;
      if (la.sub !== 'pick') return;
      const rowH = 140 / la.rows;
      const { pts, endCol } = computeLadderPath(la.rungs, la.lanes, la.rows, idx, rowH);
      la.startIdx = idx;
      la.path = pts;
      la.endCol = endCol;
      la.sub = 'drawing';
      App.haptic();
      paint();

      const pathEl = root.querySelector('#rwLadderPath');
      if (pathEl) {
        const len = pathLength(pts) || 1;
        pathEl.style.strokeDasharray = String(len);
        pathEl.style.strokeDashoffset = String(len);
        addRaf(() => {
          addRaf(() => {
            pathEl.style.transition = 'stroke-dashoffset 1.6s linear';
            pathEl.style.strokeDashoffset = '0';
          });
        });
      }
      addTimeout(() => { finalizeResult(la.tiers[endCol]); }, 1750);
    }
    function ladderSectionHTML() {
      const r = App.state.reward;
      const enough = App.state.coins >= r.cost;
      const la = g.ladder;
      if (g.phase === 'playing') {
        const lanes = la.lanes;
        const tops = Array.from({ length: lanes }, (_, i) =>
          `<button class="rw-ladder-top-btn ${la.startIdx === i ? 'chosen' : ''}" data-start="${i}" ${la.sub !== 'pick' ? 'disabled' : ''}>${i + 1}</button>`
        ).join('');
        const rowH = 140 / la.rows;
        let lines = '';
        for (let i = 0; i < lanes; i++) {
          const x = laneX(i, lanes);
          lines += `<line x1="${x}" y1="10" x2="${x}" y2="150" stroke="#C9C9D6" stroke-width="2.4" stroke-linecap="round"/>`;
        }
        for (let rr = 0; rr < la.rows; rr++) {
          const yMid = 10 + (rr + 0.5) * rowH;
          la.rungs[rr].forEach((on, i) => {
            if (on) lines += `<line x1="${laneX(i, lanes)}" y1="${yMid}" x2="${laneX(i + 1, lanes)}" y2="${yMid}" stroke="#C9C9D6" stroke-width="2.4" stroke-linecap="round"/>`;
          });
        }
        let pathSvg = '';
        if (la.path) {
          const d = 'M ' + la.path.map(p => `${p.x},${p.y}`).join(' L ');
          pathSvg = `<path id="rwLadderPath" d="${d}" fill="none" stroke="var(--orange)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
        }
        const bottoms = Array.from({ length: lanes }, () => `<div class="rw-ladder-bottom-box">❓</div>`).join('');
        const descText = la.sub === 'pick' ? '출발점 하나를 골라보세요!' : '경로를 따라 내려가는 중...';
        return `
        <div class="rw-game-title">사다리타기</div>
        <div class="rw-game-desc">${descText}</div>
        <div class="rw-ladder-wrap">
          <div class="rw-ladder-tops" style="grid-template-columns:repeat(${lanes},1fr)">${tops}</div>
          <svg class="rw-ladder-svg" viewBox="0 0 100 160" preserveAspectRatio="none">${lines}${pathSvg}</svg>
          <div class="rw-ladder-bottoms" style="grid-template-columns:repeat(${lanes},1fr)">${bottoms}</div>
        </div>`;
      }
      if (g.phase === 'result') {
        return `
        <div class="rw-game-title">사다리타기 결과</div>
        ${resultBlockHTML(g.tier)}
        ${retryButtonHTML()}`;
      }
      return `
      <div class="rw-game-title">사다리타기</div>
      <div class="rw-game-desc">사다리를 타고 내려가면 결과가 나와요!</div>
      <button class="rw-play-btn" id="rwPlayBtn" ${enough ? '' : 'disabled'}>${enough ? `플레이하기 (-${r.cost} 🪙)` : '코인이 부족해요'}</button>
      ${!enough ? `<div class="rw-play-hint">할 일을 더 완료해야 해요</div>` : ''}`;
    }

    // ---- 4) 룰렛 ----
    function rouletteGradient() {
      const colorVar = { gold: 'var(--rw-gold)', silver: 'var(--rw-silver)', bronze: 'var(--rw-bronze)' };
      const stops = ROULETTE_LAYOUT.map((t, i) => `${colorVar[t]} ${i * 45}deg ${(i + 1) * 45}deg`).join(', ');
      return `conic-gradient(from 0deg, ${stops})`;
    }
    function startRoulette() {
      if (!chargeCoin()) return;
      window.ModSound && ModSound.play('spin');
      const ro = g.roulette;
      const idx = Math.floor(Math.random() * 8);
      const tier = ROULETTE_LAYOUT[idx];
      const jitter = (Math.random() * 20 - 10); // 슬라이스 중심에서 ±10도
      const land = idx * 45 + 22.5 + jitter;
      const spins = 6 + Math.floor(Math.random() * 2); // 6~7바퀴 (항상 5바퀴 이상)
      const rotation = spins * 360 - land;
      ro.rotation = rotation;
      ro.targetTier = tier;
      g.phase = 'playing'; g.tier = null;
      paint();

      const wheelEl = root.querySelector('#rwWheel');
      if (wheelEl) {
        wheelEl.style.transition = 'none';
        wheelEl.style.transform = 'rotate(0deg)';
        addRaf(() => {
          addRaf(() => {
            wheelEl.style.transition = 'transform 4s cubic-bezier(.15,.9,.25,1)';
            wheelEl.style.transform = `rotate(${rotation}deg)`;
          });
        });
      }
      addTimeout(() => { finalizeResult(tier); }, 4200);
    }
    function rouletteSectionHTML() {
      const r = App.state.reward;
      const enough = App.state.coins >= r.cost;
      if (g.phase === 'playing') {
        return `
        <div class="rw-game-title">룰렛</div>
        <div class="rw-game-desc">룰렛이 돌아가고 있어요...</div>
        <div class="rw-roulette-stage">
          <div class="rw-roulette-pointer"></div>
          <div class="rw-wheel" id="rwWheel" style="background:${rouletteGradient()};transform:rotate(0deg)"><div class="rw-wheel-hub">🎡</div></div>
        </div>`;
      }
      if (g.phase === 'result') {
        return `
        <div class="rw-game-title">룰렛 결과</div>
        ${resultBlockHTML(g.tier)}
        ${retryButtonHTML()}`;
      }
      return `
      <div class="rw-game-title">룰렛</div>
      <div class="rw-game-desc">SPIN을 누르면 룰렛이 돌아가요!</div>
      <div class="rw-roulette-stage">
        <div class="rw-roulette-pointer"></div>
        <div class="rw-wheel" style="background:${rouletteGradient()}"><div class="rw-wheel-hub">🎡</div></div>
      </div>
      <button class="rw-spin-btn" id="rwPlayBtn" ${enough ? '' : 'disabled'}>${enough ? `SPIN! 🎯 (-${r.cost} 🪙)` : '코인이 부족해요'}</button>
      ${!enough ? `<div class="rw-play-hint">할 일을 더 완료해야 해요</div>` : ''}`;
    }

    // ---- 게임 선택 칩 + 디스패치 ----
    function gameChipsHTML() {
      const r = App.state.reward;
      if (!r.freePick) return '';
      return `<div class="rw-gamechips">${Object.keys(GAMES).map(k =>
        `<button class="rw-gamechip ${k === r.game ? 'on' : ''}" data-game="${k}">${GAMES[k].emoji} ${GAMES[k].label}</button>`
      ).join('')}</div>`;
    }
    function gameSectionHTML() {
      const r = App.state.reward;
      if (r.game === 'gacha') return gachaSectionHTML();
      if (r.game === 'ladder') return ladderSectionHTML();
      if (r.game === 'roulette') return rouletteSectionHTML();
      return stopSectionHTML();
    }
    function switchGame(newKind) {
      const r = App.state.reward;
      if (!r.freePick || !GAMES[newKind] || r.game === newKind) return;
      // 진행 중이던 게임 상태는 초기화. 이미 차감된 코인은 환불하지 않음(아직 시작 전이면 애초에 차감이 없었음).
      r.game = newKind;
      App.save();
      // g(=ModReward._game)는 이 render() 클로저 전체에서 const로 캡처돼 있으므로
      // 참조 자체를 바꾸지 않고 내용만 초기화해 동기화가 깨지지 않게 한다.
      Object.assign(g, freshGameState(newKind));
      paint();
    }

    // ---- 보상 바로 받기 ----
    function receiveReal() {
      const r = App.state.reward;
      if (App.state.coins < r.cost) return;
      App.state.coins -= r.cost;
      r.history = r.history || [];
      r.history.unshift({ id: uid(), date: fmtDate(), tier: 'real', benefit: r.realBenefit, cost: r.cost, claimed: false, claimedAt: null, requested: false });
      App.save();
      App.haptic();
      App.toast('축하해요! 보상을 받았어요 🎉');
      g.celebrate = true;
      paint();
      ModReward._celTimer = setTimeout(() => { g.celebrate = false; paint(); }, 2200);
    }

    function openSettingsSheet() {
      const r = App.state.reward;
      const body = `
        <div class="field"><label>보상 내용</label><input class="inp" id="rwInpBenefit" value="${escHtml(r.realBenefit || '')}" placeholder="예: 주말 놀이공원 가기"></div>
        <div class="field"><label>필요 코인</label><input class="inp" type="number" min="1" id="rwInpCost" value="${r.cost || 0}"></div>
        <div class="field">
          <label>보상 받는 방법</label>
          <div class="rw-seg">
            <button type="button" class="rw-seg-btn ${r.mode === 'real' ? 'on' : ''}" data-mode="real">🎁 바로 받기</button>
            <button type="button" class="rw-seg-btn ${r.mode === 'game' ? 'on' : ''}" data-mode="game">🎲 미니게임으로 결정</button>
          </div>
        </div>
        <div class="rw-tier-fields ${r.mode === 'game' ? '' : 'hidden'}" id="rwTierFields">
          <div class="field"><label>🥇 골드 보상 문구</label><input class="inp" id="rwInpGold" value="${escHtml(r.tiers.gold || '')}"></div>
          <div class="field"><label>🥈 실버 보상 문구</label><input class="inp" id="rwInpSilver" value="${escHtml(r.tiers.silver || '')}"></div>
          <div class="field"><label>🥉 브론즈 보상 문구</label><input class="inp" id="rwInpBronze" value="${escHtml(r.tiers.bronze || '')}"></div>
          <div class="field">
            <label>아이가 할 게임</label>
            <div class="rw-gamepick-row" id="rwGamePick">
              ${Object.keys(GAMES).map(k => `<button type="button" class="rw-gamepick-btn ${k === r.game ? 'on' : ''}" data-game="${k}">${GAMES[k].emoji} ${GAMES[k].label}</button>`).join('')}
            </div>
          </div>
          <div class="panel" style="padding:4px 14px;margin-top:2px">
            <div class="toggle-row">
              <div><div class="tl">🙌 아이가 직접 고르게 하기</div><div class="td">켜면 아이 화면에 4가지 게임이 모두 보이고 아이가 골라요</div></div>
              <button type="button" class="sw-tog ${r.freePick ? 'on' : ''}" id="rwFreePickTog"></button>
            </div>
          </div>
        </div>
      `;
      const foot = `<button class="btn full" id="rwSaveBtn">저장하기</button>`;
      App.sheet('보상 설정하기', body, foot, (bodyEl, footEl) => {
        let mode = r.mode;
        let gamePick = r.game;
        let freePickVal = r.freePick;
        bodyEl.querySelectorAll('.rw-seg-btn').forEach(b => {
          b.addEventListener('click', () => {
            mode = b.dataset.mode;
            bodyEl.querySelectorAll('.rw-seg-btn').forEach(x => x.classList.remove('on'));
            b.classList.add('on');
            const tf = bodyEl.querySelector('#rwTierFields');
            if (tf) tf.classList.toggle('hidden', mode !== 'game');
          });
        });
        bodyEl.querySelectorAll('.rw-gamepick-btn').forEach(b => {
          b.addEventListener('click', () => {
            gamePick = b.dataset.game;
            bodyEl.querySelectorAll('.rw-gamepick-btn').forEach(x => x.classList.remove('on'));
            b.classList.add('on');
          });
        });
        const freePickBtn = bodyEl.querySelector('#rwFreePickTog');
        if (freePickBtn) {
          freePickBtn.addEventListener('click', () => {
            freePickVal = !freePickVal;
            freePickBtn.classList.toggle('on', freePickVal);
          });
        }
        const saveBtn = footEl.querySelector('#rwSaveBtn');
        saveBtn.addEventListener('click', () => {
          const benefit = bodyEl.querySelector('#rwInpBenefit').value.trim() || r.realBenefit;
          const cost = Math.max(1, parseInt(bodyEl.querySelector('#rwInpCost').value, 10) || r.cost);
          r.realBenefit = benefit;
          r.cost = cost;
          r.mode = mode;
          r.game = gamePick;
          r.freePick = freePickVal;
          if (mode === 'game') {
            r.tiers = {
              gold: bodyEl.querySelector('#rwInpGold').value.trim() || benefit,
              silver: bodyEl.querySelector('#rwInpSilver').value.trim() || (benefit + ' (조금 작게)'),
              bronze: bodyEl.querySelector('#rwInpBronze').value.trim() || '아쉽지만 작은 응원 선물이에요 🍭'
            };
          }
          App.save();
          App.render();
          App.closeSheet();
          App.toast('보상이 저장됐어요!');
        });
      });
    }

    function realSectionHTML() {
      const r = App.state.reward;
      const enough = App.state.coins >= r.cost;
      return `
      <div class="rw-game">
        <div class="rw-game-title">보상 받기</div>
        <div class="rw-game-desc">코인을 다 모으면 바로 받을 수 있어요!</div>
        <button class="rw-real-btn" id="rwRealBtn" ${enough ? '' : 'disabled'}>${enough ? '보상 받기 🎁' : '코인을 더 모아주세요'}</button>
        ${!enough ? `<div class="rw-play-hint">할 일을 더 완료해야 해요</div>` : ''}
        ${g.celebrate ? `<div class="rw-celebrate"><div class="rw-cel-emoji">🎉</div><div class="rw-cel-text">축하해요! 보상을 받았어요</div></div>` : ''}
      </div>`;
    }

    // ---- 실물 보상 수령 확인 ----
    function unclaimedList() {
      return (App.state.reward.history || []).filter(h => !h.claimed);
    }

    function historyBadge(h) {
      if (h.claimed) return `<span class="rw-hist-badge claimed">받았어요</span>`;
      if (h.requested) return `<span class="rw-hist-badge requested">확인 요청</span>`;
      return `<span class="rw-hist-badge waiting">기다리는 중</span>`;
    }

    // 아이 화면: 미수령 보상이 있으면 눈에 띄는 배너를 보여주고, "부모님께 보여주기"만 누르게 함
    function childClaimBannerHTML() {
      const list = unclaimedList();
      if (!list.length) return '';
      const allRequested = list.every(h => h.requested);
      return `
      <div class="rw-claim-banner ${allRequested ? 'requested' : ''}">
        <div class="rw-claim-emoji">🎁</div>
        <div class="rw-claim-text">
          <div class="rw-claim-title">${allRequested ? '부모님 확인을 기다리고 있어요' : '받을 보상이 있어요!'}</div>
          <div class="rw-claim-sub">${allRequested ? '조금만 기다려주세요' : `아직 못 받은 보상이 ${list.length}개 있어요`}</div>
        </div>
        <button type="button" class="rw-claim-btn" id="rwClaimBtn" ${allRequested ? 'disabled' : ''}>${allRequested ? '요청 보냄 ✓' : '부모님께 보여주기'}</button>
      </div>`;
    }

    function requestParentCheck() {
      const r = App.state.reward;
      const targets = (r.history || []).filter(h => !h.claimed && !h.requested);
      if (!targets.length) return;
      targets.forEach(h => { h.requested = true; });
      App.save();
      App.haptic();
      App.toast('부모님께 확인 요청을 보냈어요');
      paint();
    }

    // 부모 모드: 미수령 보상 카드 목록. "줬어요"를 누르면 체크마크 연출 후 claimed 처리
    function parentClaimSectionHTML() {
      const list = unclaimedList().filter(h => !ModReward._dismissed[h.id]);
      if (!list.length) return '';
      return `
      <div class="sec rw-parent-claims">
        <div class="sec-h"><h2>보상을 줬는지 확인해주세요</h2></div>
        ${list.map(h => parentClaimCardHTML(h)).join('')}
      </div>`;
    }

    function parentClaimCardHTML(h) {
      const medal = { gold: '🥇', silver: '🥈', bronze: '🥉', real: '🎁' };
      return `
      <div class="rw-claim-card" data-claim-id="${h.id}">
        <div class="rw-claim-card-top">
          <span class="rw-claim-card-medal">${medal[h.tier] || '🎁'}</span>
          <div class="rw-claim-card-body">
            <div class="rw-claim-card-benefit">${escHtml(h.benefit)}</div>
            <div class="rw-claim-card-date">${escHtml(h.date)} · ${h.cost}🪙${h.requested ? ' · 아이가 확인 요청했어요' : ''}</div>
          </div>
        </div>
        <div class="rw-claim-card-btns">
          <button type="button" class="rw-claim-later-btn" data-claim-later="${h.id}">나중에</button>
          <button type="button" class="rw-claim-done-btn" data-claim-done="${h.id}">줬어요 ✓</button>
        </div>
        <div class="rw-claim-check-overlay" data-claim-overlay="${h.id}"></div>
      </div>`;
    }

    function dismissLater(id) {
      ModReward._dismissed[id] = true;
      paint();
    }

    function markClaimed(id) {
      const r = App.state.reward;
      const h = (r.history || []).find(x => x.id === id);
      if (!h || h.claimed) return;
      const cardEl = root.querySelector(`[data-claim-id="${id}"]`);
      const overlayEl = root.querySelector(`[data-claim-overlay="${id}"]`);
      const finish = () => {
        h.claimed = true;
        h.claimedAt = new Date().toISOString();
        App.save();
        App.toast('보상을 전달했어요 🎉');
        paint();
      };
      if (cardEl && overlayEl) {
        overlayEl.innerHTML = `
          <svg class="rw-check-svg" viewBox="0 0 64 64">
            <circle class="rw-check-circle" cx="32" cy="32" r="26" pathLength="100"></circle>
            <path class="rw-check-path" d="M20 33 L28 41 L45 22" pathLength="100"></path>
          </svg>`;
        overlayEl.classList.add('show');
        cardEl.classList.add('rw-claim-card--done');
        App.haptic();
        addTimeout(finish, 650);
      } else {
        finish();
      }
    }

    function historyHTML() {
      const hist = App.state.reward.history || [];
      if (!hist.length) {
        return `<div class="empty-note"><div class="big">🗂️</div>아직 받은 보상이 없어요</div>`;
      }
      const medal = { gold: '🥇', silver: '🥈', bronze: '🥉', real: '🎁' };
      return hist.slice(0, 10).map(h => `
        <div class="rw-hist-item">
          <div class="rw-hist-medal">${medal[h.tier] || '🎁'}</div>
          <div class="rw-hist-body">
            <div class="rw-hist-benefit">${escHtml(h.benefit)}</div>
            <div class="rw-hist-date">${escHtml(h.date)}</div>
          </div>
          <div class="rw-hist-right">
            <div class="rw-hist-cost">-${h.cost}🪙</div>
            ${historyBadge(h)}
          </div>
        </div>
      `).join('');
    }

    function template() {
      const r = App.state.reward;
      const modeBadge = r.mode === 'game' ? '🎲 게임으로 결정' : '🎁 바로 받기';
      const stats = earnedStats();
      const pct = r.cost > 0 ? Math.min(100, Math.round(App.state.coins / r.cost * 100)) : 100;
      const remaining = Math.max(0, r.cost - App.state.coins);
      const goalText = remaining > 0 ? `목표까지 ${remaining} 코인 남았어요!` : `목표를 달성했어요! 🎉`;

      return `
      <div class="rw-wrap">
        <div class="rw-wallet">
          <div class="rw-wallet-top">
            <span class="rw-coin-ico">🪙</span>
            <span class="rw-coin-num" id="rwCoinNum">${App.state.coins}</span>
            <span class="rw-coin-label">코인</span>
          </div>
          <div class="rw-wallet-sub">
            <span>오늘 <b>+${stats.today}</b></span>
            <span>이번 주 <b>+${stats.week}</b></span>
          </div>
          <div class="rw-goal-row">
            <div class="rw-goal-bar"><div class="rw-goal-fill" style="width:${pct}%"></div></div>
            <div class="rw-goal-text">${goalText}</div>
          </div>
        </div>

        ${App.isMaster() ? parentClaimSectionHTML() : childClaimBannerHTML()}

        <div class="rw-benefit-card">
          <div class="rw-benefit-badge">${modeBadge}</div>
          <div class="rw-benefit-body">
            <div class="rw-benefit-emoji">🎁</div>
            <div class="rw-benefit-text">${escHtml(r.realBenefit || '아직 정해지지 않았어요')}</div>
          </div>
          <div class="rw-benefit-cost">필요 코인 <b>${r.cost}</b> 🪙</div>
          <div class="rw-benefit-note">부모님이 정한 보상이에요</div>
        </div>

        ${r.mode === 'game' ? `
        <div class="rw-game">
          ${gameChipsHTML()}
          ${gameSectionHTML()}
        </div>` : realSectionHTML()}

        ${App.isMaster() ? `
        <div class="sec rw-master">
          <div class="sec-h"><h2>보상 관리</h2></div>
          <button class="btn line full" id="rwSettingsBtn">보상 설정하기 ⚙️</button>
        </div>` : `<div class="rw-child-note">보상은 부모님이 정해요 🌷</div>`}

        <div class="sec">
          <div class="sec-h"><h2>최근 보상 기록</h2></div>
          ${historyHTML()}
        </div>
      </div>`;
    }

    function bindEvents() {
      const r = App.state.reward;
      if (r.mode === 'game') {
        if (r.freePick) {
          const _onChip = root.querySelector('.rw-gamechip.on');
          const _strip = root.querySelector('.rw-gamechips');
          if (_onChip && _strip) {
            const want = _onChip.offsetLeft - (_strip.clientWidth - _onChip.offsetWidth) / 2;
            const max = Math.max(0, _strip.scrollWidth - _strip.clientWidth);
            _strip.scrollLeft = Math.max(0, Math.min(max, want));
          }
          root.querySelectorAll('.rw-gamechip').forEach(b => {
            b.addEventListener('click', () => switchGame(b.dataset.game));
          });
        }
        const kind = r.game;
        if (kind === 'gacha') {
          if (g.phase === 'idle') { const btn = root.querySelector('#rwPlayBtn'); if (btn) btn.addEventListener('click', startGacha); }
          else if (g.phase === 'playing' && g.gacha.sub === 'choose') {
            root.querySelectorAll('.rw-capsule').forEach(el => el.addEventListener('click', () => pickCapsule(+el.dataset.idx)));
          } else if (g.phase === 'result') { const btn = root.querySelector('#rwRetryBtn'); if (btn) btn.addEventListener('click', startGacha); }
        } else if (kind === 'ladder') {
          if (g.phase === 'idle') { const btn = root.querySelector('#rwPlayBtn'); if (btn) btn.addEventListener('click', startLadder); }
          else if (g.phase === 'playing' && g.ladder.sub === 'pick') {
            root.querySelectorAll('.rw-ladder-top-btn').forEach(el => el.addEventListener('click', () => pickLadderStart(+el.dataset.start)));
          } else if (g.phase === 'result') { const btn = root.querySelector('#rwRetryBtn'); if (btn) btn.addEventListener('click', startLadder); }
        } else if (kind === 'roulette') {
          if (g.phase === 'idle') { const btn = root.querySelector('#rwPlayBtn'); if (btn) btn.addEventListener('click', startRoulette); }
          else if (g.phase === 'result') { const btn = root.querySelector('#rwRetryBtn'); if (btn) btn.addEventListener('click', startRoulette); }
        } else {
          if (g.phase === 'idle') { const btn = root.querySelector('#rwPlayBtn'); if (btn) btn.addEventListener('click', startStop); }
          else if (g.phase === 'playing') { const btn = root.querySelector('#rwStopBtn'); if (btn) btn.addEventListener('click', stopStop); }
          else if (g.phase === 'result') { const btn = root.querySelector('#rwRetryBtn'); if (btn) btn.addEventListener('click', startStop); }
        }
      } else {
        const btn = root.querySelector('#rwRealBtn');
        if (btn) btn.addEventListener('click', receiveReal);
      }
      if (App.isMaster()) {
        const sBtn = root.querySelector('#rwSettingsBtn');
        if (sBtn) sBtn.addEventListener('click', openSettingsSheet);
      }
      bindClaimEvents();
    }

    function bindClaimEvents() {
      if (App.isMaster()) {
        root.querySelectorAll('[data-claim-done]').forEach(btn => {
          btn.addEventListener('click', () => markClaimed(btn.dataset.claimDone));
        });
        root.querySelectorAll('[data-claim-later]').forEach(btn => {
          btn.addEventListener('click', () => dismissLater(btn.dataset.claimLater));
        });
      } else {
        const cb = root.querySelector('#rwClaimBtn');
        if (cb) cb.addEventListener('click', requestParentCheck);
      }
    }

    function paint() {
      const from = (ModReward._lastCoins === undefined) ? App.state.coins : ModReward._lastCoins;
      root.innerHTML = template();
      bindEvents();
      const coinEl = root.querySelector('#rwCoinNum');
      if (coinEl) animateCoinNum(coinEl, from, App.state.coins);
      ModReward._lastCoins = App.state.coins;
      if (g.kind === 'stop' && g.stop.playing) {
        g.stop.lastTs = 0;
        ModReward._raf = requestAnimationFrame(loop);
      }
    }

    paint();
  }
};

      text-align:center; margin-top:4px; padding:10px 0 2px; font-size:12px; font-weight:800;

  render(root){
    if(!App.state.share){
      App.state.share = { scheduleShare:true, itemAlarm:true, todoDoneAlert:true, secretHide:true };
      App.save();
    } else if(App.state.share.secretHide !== true){
      App.state.share.secretHide = true;
    }
    this._avatarList();

    const role = App.state.role;
    const secretItems = this._secretItems();

    root.innerHTML = `
      <div class="fm-wrap">
        ${this._roleSwitchHtml(role)}
        ${this._membersHtml()}
        ${this._inviteHtml()}
        ${this._shareSettingsHtml()}
        ${this._secretPanelHtml(secretItems)}
        ${this._weeklyHtml(this._weeklyStats())}
        ${this._shareCtaHtml()}
        ${this._brandHtml()}
      </div>
    `;

    this._bind(root);
  },

  openSharePreview(){
    const stats = this._weeklyStats();
    const maxCount = Math.max(1, ...stats.perDay);
    const who = App.member(App.vm());
    const name = who ? who.name : '우리 가족';
    const mid = App.vm();

    /* 이번 주 날짜 범위 */
    const now = new Date();
    const sun = new Date(now); sun.setDate(now.getDate() - now.getDay());
    const sat = new Date(sun); sat.setDate(sun.getDate() + 6);
    const fmt = d => `${d.getMonth() + 1}.${d.getDate()}`;

    /* 요일별 할 일 완료 상태 */
    const todoByDay = DAYS.map((_, i) => {
      const list = (App.state.todos || []).filter(t => (t.for || 'm1') === mid && t.day === i && App.canSee(t));
      return { total: list.length, done: list.filter(t => t.done).length };
    });
    const perfectDays = todoByDay.filter(d => d.total > 0 && d.done === d.total).length;

    /* 한 줄 요약 문장 — 데이터에서 생성 */
    let head;
    if (stats.todoTotal === 0) head = `일정 ${stats.totalSchedules}개로 채운 한 주였어요`;
    else if (stats.todoDone === stats.todoTotal) head = `할 일 ${stats.todoTotal}개를 모두 끝냈어요!`;
    else if (perfectDays >= 3) head = `${perfectDays}일이나 할 일을 다 끝냈어요`;
    else head = `할 일 ${stats.todoTotal}개 중 ${stats.todoDone}개를 끝냈어요`;

    const rate = stats.todoTotal ? Math.round(stats.todoDone / stats.todoTotal * 100) : 0;

    const body = `
      <div class="fm-share-card">
        <div class="fm-share-card-top">
          <span class="fm-share-badge">KUMA <b>routine</b></span>
          <span class="fm-share-week">${fmt(sun)} – ${fmt(sat)}</span>
        </div>
        <div class="fm-share-title">${this._esc(name)}의 한 주</div>
        <div class="fm-share-head">${head}</div>

        <div class="fm-share-stats">
          <div><span>일정</span><b>${stats.totalSchedules}<i>개</i></b></div>
          <div><span>할 일 완료</span><b>${stats.todoDone}<i>/${stats.todoTotal}</i></b></div>
          <div><span>모은 코인</span><b>${stats.coins}<i>개</i></b></div>
        </div>

        <div class="fm-share-chart">
          <div class="fm-share-chart-head">
            <span>요일별 일정 수</span>
            <span class="fm-share-legend"><i class="lg-bar"></i>일정<i class="lg-dot"></i>할 일 완료</span>
          </div>
          <div class="fm-share-bars">
            ${DAYS.map((d, i) => {
              const c = stats.perDay[i], t = todoByDay[i];
              const hp = Math.round(c / maxCount * 100);
              const st = t.total === 0 ? 'none' : (t.done === t.total ? 'full' : (t.done > 0 ? 'part' : 'zero'));
              return `<div class="fm-share-bar-col">
                <b class="fm-share-num ${c ? '' : 'z'}">${c || '·'}</b>
                <div class="fm-share-track"><div class="fm-share-bar" style="height:${c ? Math.max(8, hp) : 0}%"></div></div>
                <span class="fm-share-dow">${d[0]}</span>
                <i class="fm-share-todo ${st}" title="${t.done}/${t.total}"></i>
              </div>`;
            }).join('')}
          </div>
        </div>

        <div class="fm-share-foot">
          <div class="fm-share-rate"><div class="fm-share-rate-fill" style="width:${rate}%"></div></div>
          <span>할 일 완료율 ${rate}%</span>
        </div>
      </div>
    `;

    const foot = `
      <button type="button" class="btn line" id="fm-share-save">이미지로 저장</button>
      <button type="button" class="btn full" id="fm-share-link">링크 복사</button>
    `;

    App.sheet('이번 주 일정 카드', body, foot, (bodyEl, footEl) => {
      footEl.querySelector('#fm-share-save').addEventListener('click', () => {
        App.toast('이미지로 저장했어요');
      });
      footEl.querySelector('#fm-share-link').addEventListener('click', () => {
        this._copyText('https://kumaroutine.app/share/' + App.state.inviteCode, '공유 링크를 복사했어요');
      });
    });
  },

  _roleSwitchHtml(role){
    const hint = role === 'master'
      ? '부모 모드에서는 보상과 할 일을 설정할 수 있어요'
      : '아이 모드에서는 오늘 할 일과 일정을 확인할 수 있어요';
    return `

        <div class="fm-role-track">
          <button type="button" class="fm-role-opt ${role === 'child' ? 'on' : ''}" data-role="child">🐣 루아</button>
          <button type="button" class="fm-role-opt ${role === 'master' ? 'on' : ''}" data-role="master">🌷 엄마</button>

  _membersHtml(){
    const members = App.state.members || [];
    const addBtn = App.isMaster()
      ? `<button type="button" class="btn line full fm-add-btn" id="fm-add-member">+ 가족 추가</button>`
      : '';
    return `
      <div class="fm-section">
        <div class="sec-h"><h2>가족 구성원</h2><span class="sub">${members.length}명</span></div>
        <div class="fm-members">
          ${members.map(m => this._memberCardHtml(m)).join('')}

      </div>

  _memberCardHtml(m){
    const isMe = m.id === App.meId();
    const roleLabel = m.role === 'master' ? '부모' : '아이';
    const roleClass = m.role === 'master' ? 'fm-role-badge--master' : 'fm-role-badge--child';
    const perm = App.isMaster() ? `<div class="fm-member-perm">${this._permSummary(m.role)}</div>` : '';
    const color = m.color || '#7B96EF';
    const canEdit = isMe || App.isMaster();
    const weekCount = this._memberWeekCount(m.id);
    return `
      <div class="fm-member-card">
        <button type="button" class="fm-member-avatar ${canEdit ? '' : 'fm-avatar-locked'}" data-edit-member="${m.id}"
          style="background:${color}2A;border-color:${color}66;" aria-label="${this._esc(m.name)} 프로필 편집">${esc(m.emoji || '🙂')}</button>
        <div class="fm-member-info">
          <div class="fm-member-name-row">
            <span class="fm-member-name">${this._esc(m.name)}</span>
            <span class="fm-role-badge ${roleClass}">${roleLabel}</span>
            ${isMe ? '<span class="fm-me-badge">나</span>' : ''}
          </div>
          ${perm}
          <div class="fm-member-week">📅 이번 주 일정 ${weekCount}개</div>
        </div>
      </div>
    `;
  },

  _permSummary(role){
    return role === 'master'
      ? '일정 · 할 일 관리 · 보상 승인 · 초대 관리'
      : '일정 확인 · 할 일 완료하기 · 코인 모으기';
  },

  _memberWeekCount(id){
    const S = (App.state.schedules && App.state.schedules[id]) || {};
    let n = 0;
    for(let i = 0; i < 7; i++){
      (S[i] || []).forEach(s => { if(App.canSee(s)) n++; });
    }
    return n;
  },

  _avatarList(){
    if(!App.state.avatars || !App.state.avatars.length){
      App.state.avatars = [
        '🐣','🐻','🐰','🦊','🐼','🐨','🦁','🐯','🐸','🐧','🦄','🐙',
        '🐝','🦋','🌷','🌻','🌸','🍀','⭐️','🌙','☀️','🍎','🍓','🍑',
        '🎈','🎨','🎸','⚽️','🚀','🎮','📚','🧸','👑','💎','🧁','🍩'
      ];
      App.save();
    }
    return App.state.avatars;
  },

  _findMember(id){
    return (App.state.members || []).find(x => x.id === id);
  },

  _openMemberEditor(id){
    const isNew = !id;
    const canEdit = isNew ? App.isMaster() : (id === App.meId() || App.isMaster());
    if(!canEdit){
      App.toast('본인 프로필만 바꿀 수 있어요');
      return;
    }

    const avatars = this._avatarList();
    const existing = isNew ? null : this._findMember(id);
    if(!isNew && !existing){
      App.toast('프로필을 찾을 수 없어요');
      return;
    }
    const mem = isNew
      ? { name:'', emoji:avatars[0], role:'child', color:PALETTE[3].fill }
      : existing;

    const usedBy = {};
    (App.state.members || []).forEach(x => {
      if(!isNew && x.id === mem.id) return;
      if(x.emoji) usedBy[x.emoji] = x.name;
    });

    const body = `
      <div class="field">
        <label>이름</label>
        <input class="inp" id="fmName" placeholder="이름을 입력해주세요" maxlength="8" value="${this._esc(mem.name)}">
      </div>
      ${isNew ? `
      <div class="field">
        <label>역할</label>
        <div class="fm-role-track" id="fmRolePick">
          <button type="button" class="fm-role-opt on" data-role-pick="child">🐣 아이</button>
          <button type="button" class="fm-role-opt" data-role-pick="master">🌷 부모</button>
        </div>
      </div>` : ''}
      <div class="field">
        <label>아바타</label>
        <div class="fm-avatar-grid" id="fmAvatarGrid">
          ${avatars.map(e => {
            const dupeName = usedBy[e];
            const on = e === mem.emoji;
            return `<button type="button" class="fm-avatar-cell ${on ? 'on' : ''} ${dupeName ? 'dupe' : ''}" data-emoji="${e}">
              <span class="fm-avatar-emoji">${e}</span>
              ${dupeName ? `<span class="fm-avatar-dupe-label">${this._esc(dupeName)}</span>` : ''}
            </button>`;
          }).join('')}
        </div>
      </div>
      <div class="field">
        <label>프로필 색</label>
        <div class="swatches" id="fmColorPick">
          ${PALETTE.map(p => `<button type="button" class="sw ${p.fill === mem.color ? 'on' : ''}" data-color="${p.fill}" style="background:${p.fill}"></button>`).join('')}
        </div>
      </div>
    `;

    const foot = `
      <button type="button" class="btn line" id="fmCancel" style="flex:0 0 96px">취소</button>
      <button type="button" class="btn full" id="fmSave">${isNew ? '추가하기' : '저장하기'}</button>
    `;

    App.sheet(isNew ? '가족 추가' : '프로필 편집', body, foot, (b, f) => {
      let pickEmoji = mem.emoji, pickColor = mem.color, pickRole = mem.role || 'child';

      b.querySelectorAll('#fmAvatarGrid .fm-avatar-cell').forEach(btn => {
        btn.addEventListener('click', () => {
          pickEmoji = btn.dataset.emoji;
          b.querySelectorAll('#fmAvatarGrid .fm-avatar-cell').forEach(x => x.classList.remove('on'));
          btn.classList.add('on');
          if(App.haptic) App.haptic();
        });
      });

      b.querySelectorAll('#fmColorPick .sw').forEach(btn => {
        btn.addEventListener('click', () => {
          pickColor = btn.dataset.color;
          b.querySelectorAll('#fmColorPick .sw').forEach(x => x.classList.remove('on'));
          btn.classList.add('on');
          if(App.haptic) App.haptic();
        });
      });

      const roleTrack = b.querySelector('#fmRolePick');
      if(roleTrack){
        roleTrack.querySelectorAll('[data-role-pick]').forEach(btn => {
          btn.addEventListener('click', () => {
            pickRole = btn.dataset.rolePick;
            roleTrack.querySelectorAll('[data-role-pick]').forEach(x => x.classList.remove('on'));
            btn.classList.add('on');
          });
        });
      }

      f.querySelector('#fmCancel').addEventListener('click', () => App.closeSheet());
      f.querySelector('#fmSave').addEventListener('click', () => {
        const name = b.querySelector('#fmName').value.trim();
        if(!name){
          App.toast('이름을 입력해주세요');
          b.querySelector('#fmName').focus();
          return;
        }
        if(isNew){
          const newId = uid();
          App.state.members.push({ id:newId, name, emoji:pickEmoji, role:pickRole, color:pickColor });
          App.state.schedules[newId] = {};
          App.save();
          App.render();
          App.closeSheet();
          App.toast('가족을 추가했어요');
        } else {
          Object.assign(mem, { name, emoji:pickEmoji, color:pickColor });
          App.save();
          App.render();
          App.closeSheet();
          App.toast('프로필을 저장했어요');
        }
      });
    });
  },

  _inviteHtml(){
    return `
      <div class="fm-section">
        <div class="sec-h"><h2>초대 코드</h2><span class="sub">가족에게 공유해보세요</span></div>
        <div class="panel fm-invite">
          <div class="fm-invite-row">
            <div class="fm-code-box">${this._esc(App.state.inviteCode)}</div>
            <button type="button" class="btn ghost fm-copy-btn" id="fm-copy-code">코드 복사</button>
          </div>
          <div class="fm-qr-wrap">
            ${this._qrHtml(App.state.inviteCode)}
            <div class="fm-qr-label">QR로도 초대할 수 있어요<span>카메라로 스캔하면 초대 링크가 열려요</span></div>
            <button type="button" class="fm-qr-link" id="fm-copy-link">
              <span class="fm-qr-link-ico">🔗</span>${this._esc(this._inviteUrl())}
            </button>
          </div>
        </div>
      </div>
    `;
  },

  _inviteUrl(code){
    return 'https://kuma.routine/invite/' + String(code || App.state.inviteCode || 'HRK-0000');
  },

  _qrHtml(code){
    // 실제 스캔 가능한 QR (ModQR). 모듈이 없으면 아래 임시 격자로 폴백.
    if(window.ModQR && typeof ModQR.svg === 'function'){
      const svg = ModQR.svg(this._inviteUrl(code), { size: 140, margin: 2, dark: 'var(--ink)', rounded: false });
      if(svg) return `<div class="fm-qr-card">${svg}</div>`;
    }
    return this._qrFallbackHtml(code);
  },

  _qrFallbackHtml(code){
    const n = 13;
    const str = String(code || 'HRK');
    const isFinderBlock = (r, c) => (r < 5 && c < 5) || (r < 5 && c >= n - 5) || (r >= n - 5 && c < 5);
    const finderOn = (r, c) => {
      const lr = r < 5 ? r : r - (n - 5);
      const lc = c < 5 ? c : c - (n - 5);
      return lr === 0 || lr === 4 || lc === 0 || lc === 4 || (lr === 2 && lc === 2);
    };
    const hash = (r, c) => {
      const s = str + '_' + r + '_' + c;
      let h = 0;
      for(let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
      return h;
    };
    let cells = '';
    for(let r = 0; r < n; r++){
      for(let c = 0; c < n; c++){
        const on = isFinderBlock(r, c) ? finderOn(r, c) : (hash(r, c) % 5 < 2);
        cells += `<span class="fm-qr-cell${on ? ' on' : ''}"></span>`;
      }
    }
    return `<div class="fm-qr" style="grid-template-columns:repeat(${n},1fr);grid-template-rows:repeat(${n},1fr)">${cells}</div>`;
  },

  _shareSettingsHtml(){
    const sh = App.state.share;
    return `
      <div class="fm-section">
        <div class="sec-h"><h2>일정 공유 설정</h2><span class="sub">가족과 무엇을 나눌지 정해요</span></div>

          if(s.secret && s.owner === my){
            items.push({ type: 'schedule', label: s.t, sub: `${DAYS[i][0]}요일 · ${disp(toMin(s.s))}` });
          }
        });

    (App.state.todos || []).forEach(t => {
      if(t.secret && t.owner === my){
        items.push({ type: 'todo', label: t.text, sub: `${DAYS[t.day][0]}요일 · 🪙 ${t.coin || 0}` });

  _weeklyStats(){

    for(let i = 0; i < 7; i++){

  _bind(root){
    root.querySelectorAll('[data-role]').forEach(btn => {
      btn.addEventListener('click', () => {
        const r = btn.dataset.role;
        if(App.state.role === r) return;
        if(r === 'master' && typeof App.toMaster === 'function'){ App.toMaster(); return; }
        if(r === 'child' && typeof App.toChild === 'function'){ App.toChild(); return; }
        App.state.role = r;
        App.save();
        App.render();
      });
    });

    const copyBtn = root.querySelector('#fm-copy-code');
    if(copyBtn){
      copyBtn.addEventListener('click', () => {
        this._copyText(App.state.inviteCode, '초대 코드를 복사했어요');
      });
    }

    const copyLinkBtn = root.querySelector('#fm-copy-link');
    if(copyLinkBtn){
      copyLinkBtn.addEventListener('click', () => {
        this._copyText(this._inviteUrl(), '초대 링크를 복사했어요');
      });
    }

    root.querySelectorAll('[data-share-key]').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.shareKey;
        if(key === 'secretHide'){
          App.toast('이 설정은 항상 켜져 있어요');
          return;
        }
        App.state.share[key] = !App.state.share[key];
        App.save();
        btn.classList.toggle('on', App.state.share[key]);
        if(App.haptic) App.haptic();
      });
    });

    root.querySelectorAll('[data-edit-member]').forEach(btn => {
      btn.addEventListener('click', () => {
        this._openMemberEditor(btn.dataset.editMember);
      });
    });

    const addMemberBtn = root.querySelector('#fm-add-member');
    if(addMemberBtn){
      addMemberBtn.addEventListener('click', () => this._openMemberEditor(null));
    }

    const secretToggle = root.querySelector('#fm-secret-toggle');
    const secretBody = root.querySelector('#fm-secret-body');
    if(secretToggle && secretBody){
      secretToggle.addEventListener('click', () => {
        const expanded = secretToggle.getAttribute('aria-expanded') === 'true';
        secretToggle.setAttribute('aria-expanded', String(!expanded));
        secretToggle.classList.toggle('on', !expanded);
        if(App.haptic) App.haptic();
        if(expanded){
          secretBody.style.maxHeight = '0px';
        } else {
          secretBody.style.maxHeight = secretBody.scrollHeight + 'px';
        }
      });
    }

    const shareCta = root.querySelector('#fm-share-cta');
    if(shareCta){
      shareCta.addEventListener('click', () => this.openSharePreview());
    }
  },

  _copyText(text, successMsg){
    const done = () => {
      App.toast(successMsg);
      if(App.haptic) App.haptic();
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(() => this._fallbackCopy(text, done));
    } else {
      this._fallbackCopy(text, done);
    }
  },

  _fallbackCopy(text, done){
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    }catch(e){
      App.toast('복사에 실패했어요');
    }
  },

  _esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
};

  /* ================= 부팅 ================= */
  init(){
    if(!App.state.notify){
      App.state.notify = {
        lead:10,
        prepLead:'night',
        todoDaily:true,
        rewardOn:true,
        quiet:{ on:true, from:'22:00', to:'07:00' },
        read:[],
        log:[]
      };
      App.save();
    }
    this._stack = this._stack || [];

    // 이미 지난 시각의 알림은 부팅 시점에 "이미 지나감"으로 처리해서
    // 새로고침할 때마다 배너가 한꺼번에 쏟아지지 않게 함.
    // (시간 미리보기를 되감으면 이 표시가 초기화되어 다시 재생됨)
    this._fired = new Set();
    const now = App.nowMin();
    this._computeToday().forEach(it => { if(it.time <= now) this._fired.add(it.id); });
    this._lastKnownNow = now;

    if(this._timer) clearInterval(this._timer);
    this._timer = setInterval(() => this._tick(), 3000);
  },

  _tick(){
    if(!App.state.notify) return;
    const now = App.nowMin();
    if(this._lastKnownNow != null && now < this._lastKnownNow - 1){
      this._fired = new Set(); // 시간이 되감김 -> 다시 알릴 수 있게 초기화
    }
    this._lastKnownNow = now;

    this._computeToday().forEach(it => {
      if(it.time <= now && !this._fired.has(it.id)){
        this._fired.add(it.id);
        this._fireItem(it);
      }
    });
  },

  _fireItem(it){
    const payload = { emoji:it.icon, title:it.title, body:it.body, tone:it.tone };
    if(this._inQuiet(App.nowMin())){
      this._log(payload); // 방해 금지 시간엔 배너 없이 기록만
    } else {
      this.push(payload);
    }
  },

  _inQuiet(min){
    const q = App.state.notify && App.state.notify.quiet;
    if(!q || !q.on) return false;
    const from = toMin(q.from), to = toMin(q.to);
    if(from === to) return false;
    if(from < to) return min >= from && min < to;
    return min >= from || min < to; // 자정을 넘어가는 구간
  },

  /* ================= 오늘의 알림 계산 ================= */
  _ampm(min){
    const h = Math.floor((((min % 1440) + 1440) % 1440) / 60);
    return h < 12 ? '오전' : '오후';
  },

  _computeToday(){
    if(!App.state.notify) return [];
    const cfg = App.state.notify;
    const vm = App.vm();
    const items = [];

    // 1) 일정 시작 알림
    (App.sched(vm)[App.today] || []).forEach(ev => {
      if(!ev.alarm || !App.canSee(ev)) return;
      const t = toMin(ev.s) - (cfg.lead || 10);
      items.push({
        id:`nt:${vm}:sched:${ev.id}`, time:t, icon:'🔔', tone:'info',
        title:`${cfg.lead}분 후 ${esc(ev.t)} 시작`,
        body:`${this._ampm(toMin(ev.s))} ${disp(toMin(ev.s))} 시작`,
        toggleType:'sched', schedId:ev.id, schedDay:App.today
      });
    });

    // 2) 준비물 알림
    if(cfg.prepLead === 'night'){
      const tmr = (App.today + 1) % 7;
      (App.sched(vm)[tmr] || []).forEach(ev => {
        if(!ev.alarm || !ev.items || !ev.items.length || !App.canSee(ev)) return;
        items.push({
          id:`nt:${vm}:prep:${ev.id}`, time:21 * 60, icon:'🎒', tone:'warn',
          title:`내일 ${esc(ev.t)} 준비물`,
          body:ev.items.join(', '),
          toggleType:'sched', schedId:ev.id, schedDay:tmr
        });
      });
    } else if(cfg.prepLead === 'morning'){
      (App.sched(vm)[App.today] || []).forEach(ev => {
        if(!ev.alarm || !ev.items || !ev.items.length || !App.canSee(ev)) return;
        items.push({
          id:`nt:${vm}:prepm:${ev.id}`, time:7 * 60, icon:'🎒', tone:'warn',
          title:`오늘 ${esc(ev.t)} 준비물`,
          body:ev.items.join(', '),
          toggleType:'sched', schedId:ev.id, schedDay:App.today
        });
      });
    }

    // 3) 할 일 알림
    if(cfg.todoDaily){
      const undone = App.todosOf(App.today).filter(t => !t.done && App.canSee(t));
      if(undone.length){
        items.push({
          id:`nt:${vm}:todo:${App.today}`, time:8 * 60 + 30, icon:'✅', tone:'good',
          title:`오늘 할 일 ${undone.length}개가 남았어요`,
          body:undone.slice(0, 3).map(t => t.text).join(', '),
          toggleType:'todo'
        });
      }
    }

    items.sort((a, b) => a.time - b.time);
    return items;
  },

  count(){
    if(!App.state.notify) return 0;
    const now = App.nowMin();
    const read = App.state.notify.read || [];
    return this._computeToday().filter(it => it.time <= now && read.indexOf(it.id) === -1).length;
  },

  /* ================= 알림 센터 시트 ================= */
  open(){
    if(!App.state.notify) this.init();
    const items = this._computeToday();
    const now = App.nowMin();

    let changed = false;
    const read = App.state.notify.read;
    items.forEach(it => {
      if(it.time <= now && read.indexOf(it.id) === -1){ read.push(it.id); changed = true; }
    });
    if(changed) App.save();

    const body = `
      <div class="nt-sheet-head">
        <span class="nt-sheet-head-label">오늘 예정된 알림</span>
        <button type="button" class="nt-gear-btn" id="nt-gear" aria-label="알림 설정">⚙️</button>
      </div>
      ${items.length
        ? this._listHtml(items, now)
        : `<div class="empty-note"><div class="big">🔕</div>오늘은 예정된 알림이 없어요</div>`}
    `;

    App.sheet('알림', body, '', (bodyEl) => {
      this._bindList(bodyEl);
    });
  },

  _listHtml(items, now){
    const rows = [];
    let dividerPlaced = false;
    items.forEach(it => {
      if(!dividerPlaced && it.time > now){
        rows.push(`<div class="nt-divider">지금</div>`);
        dividerPlaced = true;
      }
      rows.push(this._itemHtml(it, now));
    });
    if(!dividerPlaced) rows.push(`<div class="nt-divider">지금</div>`);
    return `<div class="nt-list">${rows.join('')}</div>`;
  },

  _itemHtml(it, now){
    const past = it.time <= now;
    const right = past
      ? `<span class="nt-item-sent">보냄</span>`
      : `<button type="button" class="nt-item-toggle on" data-toggle-type="${it.toggleType}"
           data-sched-id="${it.schedId || ''}" data-sched-day="${it.schedDay != null ? it.schedDay : ''}"
           aria-label="알림 끄기"></button>`;
    return `
      <div class="nt-item ${past ? 'past' : ''}">
        <div class="nt-item-time">${this._ampm(it.time)}<b>${disp(it.time)}</b></div>
        <div class="nt-item-icon">${it.icon}</div>
        <div class="nt-item-main">
          <div class="nt-item-title">${this._esc(it.title)}</div>
          <div class="nt-item-body">${this._esc(it.body)}</div>
        </div>
        <div class="nt-item-right">${right}</div>
      </div>
    `;
  },

  _bindList(root){
    const gear = root.querySelector('#nt-gear');
    if(gear) gear.addEventListener('click', () => this.openSettings());

    root.querySelectorAll('.nt-item-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const type = btn.dataset.toggleType;
        if(type === 'todo'){
          App.state.notify.todoDaily = false;
          App.save();
          App.toast('할 일 알림을 껐어요');
        } else {
          const day = +btn.dataset.schedDay;
          const id = btn.dataset.schedId;
          const list = App.sched()[day] || [];
          const ev = list.find(x => x.id === id);
          if(ev){
            ev.alarm = false;
            App.save();
            App.toast('알림을 껐어요');
          }
        }
        if(App.haptic) App.haptic();
        App.render();
        this.open(); // 목록 새로고침
      });
    });
  },

  /* ================= 알림 설정 시트 ================= */
  _timeOptions(sel){
    let out = '';
    for(let m = 0; m < 1440; m += 30){
      const v = toStr(m);
      out += `<option value="${v}" ${v === sel ? 'selected' : ''}>${this._ampm(m)} ${disp(m)}</option>`;
    }
    return out;
  },

        </div>

        </div>
        <div class="toggle-row">
          <div><div class="tl">방해 금지 시간</div><div class="td">이 시간엔 배너 없이 조용히 기록만 해요</div></div>
          <button type="button" class="sw-tog ${cfg.quiet.on ? 'on' : ''}" id="ntQuietTog"></button>
        </div>
      </div>
      <div class="field two nt-quiet-times">
        <div><label>시작</label><select class="inp" id="ntQuietFrom">${this._timeOptions(cfg.quiet.from)}</select></div>
        <div><label>끝</label><select class="inp" id="ntQuietTo">${this._timeOptions(cfg.quiet.to)}</select></div>
      </div>
    `;

    const foot = `<button type="button" class="btn line full" id="ntPreview">🔔 미리 보기</button>`;

    App.sheet('알림 설정', body, foot, (b, f) => {
      b.querySelectorAll('#ntLeadRow .nt-lead-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          cfg.lead = +btn.dataset.lead;

      });

      b.querySelectorAll('#ntPrepSeg .nt-seg-btn').forEach(btn => {
        btn.addEventListener('click', () => {

          btn.classList.add('on');

      b.querySelector('#ntTodoTog').addEventListener('click', e => {
        cfg.todoDaily = !cfg.todoDaily;

      b.querySelector('#ntRewardTog').addEventListener('click', e => {
